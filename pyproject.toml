[project]
name = "tiny-dlm"
version = "0.1.0"
authors = [{ name = "Ismail Ben Alla" }]
description = "Tiny decision models built from scratch in PyTorch: score every candidate at once instead of generating."
requires-python = ">=3.9"
dependencies = ["torch>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]
car = ["gymnasium[box2d]>=1.0", "pillow"]  # CarRacing (Box2D) and GIFs
web = ["pyarrow"]  # scripts/prepare_web.py reads the FineWeb-Edu parquet file

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tiny_dlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
